<!DOCTYPE html>
<html>

<head>

<title>Edit Employee</title>

<meta name="viewport" content="width=device-width, initial-scale=1">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<style>


body{

margin:0;

background:linear-gradient(135deg,#e3f2fd,#f8f9fa);

font-family:Arial;

}



.box{

width:100%;

min-height:100vh;

background:white;

padding:20px;

}



@media(min-width:768px){

.box{

width:450px;

margin:40px auto;

padding:30px;

border-radius:25px;

box-shadow:0 10px 30px rgba(0,0,0,.2);

}

}





.title{

text-align:center;

font-size:28px;

font-weight:bold;

color:#1565c0;

margin-bottom:25px;

}



label{

font-weight:bold;

margin-top:12px;

color:#333;

}



.form-control{

height:45px;

border-radius:12px;

text-align:center;

font-size:17px;

font-weight:bold;

}





.btn-update{

width:100%;

height:45px;

margin-top:25px;

border-radius:15px;

font-size:18px;

font-weight:bold;

background:linear-gradient(135deg,#00c853,#1b5e20);

color:white;

border:none;

}



.btn-back{


display:block;

width:100%;

height:45px;

line-height:45px;

margin-top:15px;

border-radius:15px;

text-align:center;

text-decoration:none;

font-size:18px;

font-weight:bold;

background:linear-gradient(135deg,#2196f3,#0d47a1);

color:white;

}



.icon{

font-size:22px;

margin-right:8px;

}




@media(max-width:767px){


.box{

padding:15px;

}


.title{

font-size:24px;

}


.form-control{

font-size:16px;

}



}



</style>


</head>


<body>


<div class="box">



<div class="title">

<i class="bi bi-pencil-square"></i>

Edit Employee

</div>





<form action="/update_employee" method="POST">



<input type="hidden"
name="id"
value="{{data[0]}}">





<label>

<i class="bi bi-building icon"></i>

Company Name

</label>


<input type="text"
name="company"
class="form-control"
value="{{data[1]}}"
required>





<label>

<i class="bi bi-calendar icon"></i>

Join Date

</label>


<input type="date"
name="join_date"
class="form-control"
value="{{data[2]}}"
required>






<label>

<i class="bi bi-geo-alt icon"></i>

Address

</label>


<input type="text"
name="address"
class="form-control"
value="{{data[3]}}">






<label>

<i class="bi bi-cash icon"></i>

Salary Per Hour

</label>


<input type="number"
name="salary_hour"
class="form-control"
value="{{data[4]}}"
required>







<button class="btn-update">

<i class="bi bi-save"></i>

Update Employee

</button>







<a href="/report" class="btn-back">

<i class="bi bi-arrow-left"></i>

Back Report

</a>





</form>



</div>


</body>

</html>
