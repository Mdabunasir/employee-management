<!DOCTYPE html>
<html>
<head>

<title>Posting Work</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<style>

body{
    margin:0;
    background:#eef3f8;
    font-family:Arial;
}


.box{

    width:100%;
    min-height:100vh;
    background:white;
    padding:20px;

}


@media(min-width:768px){

.box{

    width:400px;
    margin:30px auto;
    padding:25px;
    border-radius:25px;
    box-shadow:0 10px 30px #ccc;

}

}



.title{

    text-align:center;
    font-size:26px;
    font-weight:bold;
    color:#1565c0;
    margin-bottom:20px;

}



.form-control,
.form-select{

    height:45px;
    border-radius:12px;
    font-size:17px;
    text-align:center;
    font-weight:bold;

}



button{

    width:100%;
    height:45px;
    margin-top:15px;
    border-radius:12px!important;
    font-weight:bold;

}



.card-box{

    margin-top:20px;
    padding:15px;
    background:#e3f2fd;
    border-radius:15px;
    text-align:center;

}



.time{

    font-size:25px;
    font-weight:bold;
    color:#1565c0;

}



</style>


</head>


<body>


<div class="box">



<div class="title">

⏱ Posting Work

</div>




<!-- START FORM -->

{% if not running %}


<form action="/post_start" method="POST">


<label>Employee</label>


<select name="employee" class="form-select" required>


<option value="">Select Employee</option>


{% for e in employees %}

<option value="{{e[0]}}">

{{e[1]}}

</option>

{% endfor %}


</select>




<label class="mt-3">

Start Time

</label>


<input type="time"
name="startTime"
value="{{now}}"
class="form-control"
required>




<button class="btn btn-primary">

▶ Post Start

</button>



</form>


{% endif %}









<!-- END FORM -->


{% if running %}



<div class="card-box">


<h5>

Running Work

</h5>


<h4>

{{running[1]}}

</h4>


<div class="time">

Start : {{running[2]}}

</div>



</div>




<form action="/post_end" method="POST">


<label class="mt-3">

End Time

</label>



<input type="time"
name="endTime"
value="{{now}}"
class="form-control"
required>



<button class="btn btn-success">

⏹ Post End

</button>



</form>



{% endif %}







<a href="/" 
class="btn btn-warning mt-3"
style="width:100%;height:45px;border-radius:12px;font-weight:bold;">

⬅ Back Home

</a>



</div>


</body>
</html>
