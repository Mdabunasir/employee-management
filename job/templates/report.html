<!DOCTYPE html>
<html>

<head>

<title>Employee Report</title>

<meta name="viewport" content="width=device-width, initial-scale=1">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
background:#f2f4f8;
font-family:Arial;

}


.box{

width:100%;
min-height:100vh;
background:white;
padding:10px;

}


@media(min-width:768px){

.box{

width:1100px;
margin:30px auto;
padding:25px;
border-radius:25px;
box-shadow:0 10px 30px #ccc;

}

}



.title{

text-align:center;
font-size:26px;
font-weight:bold;
color:#1565c0;
margin-bottom:15px;

}




.info-area{

display:flex;
gap:10px;

}


.info-card{

flex:1;
padding:10px;
border-radius:12px;
color:white;
text-align:center;
font-weight:bold;

}


.hour-card{

background:#673ab7;

}



.total-card{

background:#ff9800;

}


.info-card b{

font-size:20px;

}



.btn-area{

display:flex;
gap:10px;
margin:15px 0;

}


.reset-btn,
.back-btn{

flex:1;
height:40px;
border:none;
border-radius:12px;
color:white;
font-weight:bold;
padding:10px;
text-decoration:none;
text-align:center;

}


.reset-btn{

background:green;

}


.back-btn{

background:#1565c0;

}



.search-box{

background:#eef7ff;
padding:10px;
border-radius:12px;
margin-bottom:15px;

}



.form-control,
.form-select{

height:38px;
font-size:13px;

}




.table-area{

overflow-x:auto;

}



table{

white-space:nowrap;
font-size:13px;

}



th,td{

text-align:center;
padding:6px!important;

}



</style>


</head>


<body>


<div class="box">


<div class="title">

<i class="bi bi-bar-chart-fill"></i>

Employee Report

</div>




<div class="info-area">


<div class="info-card hour-card">

<i class="bi bi-clock"></i>

Total Hour

<br>

<b id="showHour">0</b>

</div>




<div class="info-card total-card">

<i class="bi bi-cash"></i>

Total Amount

<br>

<b id="showAmount">0</b>

</div>


</div>







<div class="btn-area">


<button class="reset-btn"
onclick="resetSearch()">

<i class="bi bi-arrow-clockwise"></i>

Reset

</button>



<a href="/" class="back-btn">

<i class="bi bi-house"></i>

Home

</a>


</div>








<div class="search-box">


<div class="row g-2">


<div class="col-4">

<label>Company</label>


<select id="searchCompany"
class="form-select"
onchange="searchData()">



<option value="">All</option>


{% for c in company %}

<option value="{{c[0]}}">

{{c[0]}}

</option>

{% endfor %}


</select>


</div>





<div class="col-4">


<label>From Date</label>


<input type="date"
id="fromDate"
class="form-control"
onchange="searchData()">



</div>





<div class="col-4">


<label>To Date</label>


<input type="date"
id="toDate"
class="form-control"
onchange="searchData()">



</div>


</div>


</div>









<div class="table-area">


<table class="table table-bordered">


<thead class="table-primary">


<tr>

<th>ID</th>
<th>Company</th>
<th>Join Date</th>
<th>Address</th>
<th>Per Hour</th>
<th>Start</th>
<th>End</th>
<th>Hour</th>
<th>Total Taka</th>
<th>Action</th>


</tr>


</thead>





<tbody id="data">


{% for row in data %}


<tr>


<td>{{row[0]}}</td>

<td>{{row[1]}}</td>

<td>{{row[2]}}</td>

<td>{{row[3]}}</td>

<td>{{row[4]}}</td>

<td>{{row[5] or ""}}</td>

<td>{{row[6] or ""}}</td>

<td>{{row[7] or 0}}</td>

<td>{{row[8] or 0}}</td>



<td>
<a href="/edit_employee/{{row[0]}}"
class="btn btn-primary btn-sm">

<i class="bi bi-pencil"></i>
Edit

</a>


<a href="/delete_employee/{{row[0]}}"
onclick="return confirm('Delete Employee?')"
class="btn btn-danger btn-sm">


<i class="bi bi-trash"></i>

</a>


</td>


</tr>


{% endfor %}


</tbody>





<tfoot class="table-warning">


<tr>

<th colspan="7">

Total

</th>


<th id="totalHour">

0

</th>


<th id="totalAmount">

0

</th>


<th></th>


</tr>


</tfoot>


</table>


</div>


</div>







<script>


function searchData(){


let company =
document.getElementById("searchCompany").value;


let from =
document.getElementById("fromDate").value;


let to =
document.getElementById("toDate").value;



let rows=document.querySelectorAll("#data tr");


let hour=0;

let amount=0;



rows.forEach(function(row){


let show=true;



let rcompany=row.cells[1].innerText;


let date=row.cells[2].innerText;




if(company!="" && rcompany!=company){

show=false;

}



if(from!="" && date < from){

show=false;

}



if(to!="" && date > to){

show=false;

}





if(show){


row.style.display="";


hour += Number(row.cells[7].innerText || 0);


amount += Number(row.cells[8].innerText || 0);



}

else{


row.style.display="none";


}



});





document.getElementById("showHour").innerHTML =
hour.toFixed(2);


document.getElementById("showAmount").innerHTML =
amount.toFixed(2);


document.getElementById("totalHour").innerHTML =
hour.toFixed(2);


document.getElementById("totalAmount").innerHTML =
amount.toFixed(2);


}






function resetSearch(){


document.getElementById("searchCompany").value="";

document.getElementById("fromDate").value="";

document.getElementById("toDate").value="";


searchData();


}



window.onload=searchData;


</script>



</body>

</html>
