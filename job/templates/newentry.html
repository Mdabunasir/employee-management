<!DOCTYPE html>
<html>
<head>

<title>Employee Entry</title>

<meta name="viewport" content="width=device-width, initial-scale=1">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    background:linear-gradient(135deg,#e3f2fd,#bbdefb);

    font-family:Arial,sans-serif;

}



.box{

    width:100%;

    min-height:100vh;

    background:white;

    padding:20px 18px;

}



@media(min-width:768px){

.box{

    width:400px;

    min-height:auto;

    margin:40px auto;

    padding:30px;

    border-radius:25px;

    box-shadow:0 10px 30px rgba(0,0,0,.18);

}

}





.title{

    text-align:center;

    color:#1565c0;

    font-size:26px;

    font-weight:bold;

    margin-bottom:25px;

}





label{

    font-size:15px;

    font-weight:bold;

    color:#444;

}





.form-control{

    height:42px;

    border-radius:12px;

    margin-bottom:14px;

    font-size:16px;

    border:1px solid #ddd;

}



textarea.form-control{

    height:80px;

}





/* Save Button */

.save-btn{

    width:100%;

    height:45px;

    border:none;

    border-radius:15px;

    background:linear-gradient(135deg,#2196f3,#1565c0);

    color:white;

    font-size:18px;

    font-weight:bold;

    box-shadow:0 5px 12px rgba(0,0,0,.2);

}





/* Back Button */

.back-btn{

    display:block;

    width:100%;

    height:45px;

    line-height:45px;

    margin-top:12px;

    text-align:center;

    border-radius:15px;

    background:linear-gradient(135deg,#ffb300,#f57c00);

    color:white;

    font-size:18px;

    font-weight:bold;

    text-decoration:none;

    box-shadow:0 5px 12px rgba(0,0,0,.2);

}



</style>


</head>



<body>



<div class="box">



<div class="title">

<i class="bi bi-person-plus-fill"></i>

Employee Entry

</div>



<form action="/save_employee" method="POST">



<label>
<i class="bi bi-building"></i>
Company Name
</label>

<input type="text"
name="company"
class="form-control">





<label>
<i class="bi bi-calendar"></i>
Join Date
</label>

<input type="date"
name="join_date"
class="form-control">





<label>
<i class="bi bi-cash"></i>
Salary Per Hour
</label>

<input type="number"
name="salary_hour"
class="form-control">





<label>
<i class="bi bi-geo-alt"></i>
Address
</label>

<textarea

name="address"

class="form-control"></textarea>





<button type="submit" class="save-btn">

<i class="bi bi-save"></i>
Save Employee

</button>





<a href="/" class="back-btn">

<i class="bi bi-arrow-left"></i>
Back Home

</a>




</form>



</div>



</body>
</html>
